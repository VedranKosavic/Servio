# nginx site for Šank.
#
# WHAT A REVERSE PROXY IS (obratni proxy). The app listens on 127.0.0.1:3100 —
# "this machine only". Nothing on the internet can reach that, and the firewall
# does not open 3100 either. nginx is the piece that does answer the internet:
# it holds the TLS certificate, answers on 443, and passes each request on to
# the app over that local port. The app never talks to the outside world
# directly, and everything the outside world knows about it, it learned here.
#
# Installed by deploy/setup-server.sh to /etc/nginx/sites-available/sank, but
# NOT enabled — it needs a real domain and a certificate first. To turn it on:
#
#   sudo ln -s /etc/nginx/sites-available/sank /etc/nginx/sites-enabled/sank
#   sudo nginx -t          # checks the syntax; never reload without it
#   sudo systemctl reload nginx
#
# Replace sank.example.ba with the real domain everywhere below. Set the same
# domain as PUBLIC_URL in /opt/sank/.env, so the links in Telegram alerts point
# at a host that exists.
#
# ---------------------------------------------------------------------------
# THIS FILE IS WHAT MAKES `TRUST_PROXY=1` SAFE.
#
# /opt/sank/.env sets TRUST_PROXY=1, which tells the app to believe the
# X-Real-IP and X-Forwarded-For headers when it works out who is calling. It
# has to: behind a proxy the socket address is always 127.0.0.1, so without
# those headers every caller in the country looks like the same one person.
#
# But a header is only ever whatever somebody wrote in it. The rate limiter
# buckets by caller, and so does the PIN lockout — five wrong PINs locks *that*
# subject. If the header arriving from outside were passed through, anyone could
# send `X-Forwarded-For: 1.2.3.4`, get a fresh bucket per guess, and walk
# through both.
#
# The two proxy_set_header lines below are what close that: they OVERWRITE both
# headers with $remote_addr, the address of the socket nginx itself is talking
# to, which no client can forge. That is why TRUST_PROXY=1 and this file have to
# arrive together — the env line without this file is worse than neither.
#
# So: if nginx is ever removed, or replaced with something else in front, remove
# TRUST_PROXY=1 from /opt/sank/.env in the same breath.
# ---------------------------------------------------------------------------

# `Connection: upgrade` only when the client actually asked for an upgrade;
# otherwise `Connection: close`, which is what a normal request wants. Without
# this map, `proxy_set_header Connection $http_upgrade` would send an empty
# header on every ordinary request.
#
# NOTE: a `map` cannot live inside a server block — it belongs at the top level
# of the http context. Ubuntu's /etc/nginx/nginx.conf includes sites-enabled/*
# from inside `http { }`, so it is legal here in this file, and `nginx -t` will
# say so plainly if your install does it differently. If it complains about the
# map, move these four lines into /etc/nginx/conf.d/upgrade-map.conf instead —
# one map for the whole server, which is what it is for.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Port 80: redirect everything to https, except the one path certbot uses to
# prove it owns the domain when it renews.
server {
    listen 80;
    listen [::]:80;
    server_name sank.example.ba;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sank.example.ba;

    # --- TLS ---------------------------------------------------------------
    # TLS (the s in https) is what stops the café's wifi, the ISP or anybody on
    # the same network from reading a session cookie or a PIN in flight. It is
    # not optional here: COOKIE_SECURE defaults to true, and a secure cookie is
    # never sent over plain http — over http nobody could log in at all.
    #
    # HOW TO GET THE CERTIFICATE. certbot is Let's Encrypt's client; it proves
    # you own the domain, fetches a free certificate and renews it by itself
    # every ~60 days. Point the domain's A record at this server first, then:
    #
    #   sudo apt-get install -y certbot python3-certbot-nginx
    #   sudo certbot --nginx -d sank.example.ba
    #
    # certbot writes exactly the two paths below and adds a systemd timer for
    # the renewal. Check the renewal works, once, with:
    #
    #   sudo certbot renew --dry-run
    #
    # (If you run certbot BEFORE enabling this file, it writes its own server
    # block. Let it, then merge the proxy settings from here into that one, or
    # delete its block and enable this file — but do not leave two blocks for
    # the same server_name.)
    ssl_certificate     /etc/letsencrypt/live/sank.example.ba/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sank.example.ba/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- uploads -----------------------------------------------------------
    # How large a request body nginx will accept. nginx's own default is 1 MB,
    # which a photo from a phone passes in about a second — and the refusal is
    # nginx's 413, before the app sees anything, which makes it look like the
    # app is broken. 10 MB covers a phone camera image with room to spare.
    client_max_body_size 10m;

    # --- logs --------------------------------------------------------------
    access_log /var/log/nginx/sank.access.log;
    error_log  /var/log/nginx/sank.error.log;

    # --- the app -----------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3100;

        # WHO IS CALLING. Both of these are OVERWRITES, not appends.
        #
        # The usual recipe for the second one is
        # `proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;`, which
        # takes whatever header the client sent and appends nginx's own view of
        # the address to it. That is right when there is a chain of proxies you
        # control. Here there is not: the client is a phone on a café wifi, and
        # `$proxy_add_x_forwarded_for` would carry the phone's own invented
        # header straight into the app's rate limiter — which is exactly the
        # bucket-picking attack the app's TRUST_PROXY gate exists to prevent.
        #
        # $remote_addr is the peer of this TCP connection. It is not a header,
        # so it cannot be sent, spoofed or prepended to.
        #
        # (The app reads x-real-ip first and otherwise the LAST element of
        # x-forwarded-for — see clientIp() in server/utils/auth.ts. With these
        # two lines both answers are the same address, which is the point.)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # HTTP/1.1 plus these two headers is what lets a connection be upgraded
        # to a websocket. nginx speaks HTTP/1.0 to upstreams by default, which
        # has no upgrade mechanism, so a websocket would fail with no useful
        # error. Nothing in the app opens one today; leaving this out is the
        # kind of thing that costs an afternoon the first time something does.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A waiter's phone drops off the wifi mid-request more often than
        # anything else on this server. Fail reasonably fast rather than holding
        # a worker for a minute.
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # The app's own ETags are what make the phones cheap to refresh; nginx
        # must not rewrite the response body underneath them.
        proxy_buffering on;
    }

    # --- the API -----------------------------------------------------------
    # Every /api/ answer is private to one person: a waiter's own shift, his own
    # numbers, the owner's live figures. Two rules here.
    #
    # proxy_no_cache / proxy_cache_bypass tell nginx never to store one of these
    # responses and never to serve one from a store. There is no proxy_cache
    # zone configured in this file, so nothing is cached today anyway — these
    # two lines are what keeps that true on the day somebody adds one for the
    # static assets and does not think about /api/. Handing one waiter's cached
    # /api/me to the next phone that asks is the failure being prevented, and it
    # would look like a ghost, not like a bug.
    #
    # The app also sets `Cache-Control: private, no-cache` and `Vary: Cookie` on
    # every /api/ response itself. This is the same rule stated at the other end
    # of the wire; both, on purpose.
    location /api/ {
        proxy_pass http://127.0.0.1:3100;

        proxy_no_cache 1;
        proxy_cache_bypass 1;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --- the dev door ------------------------------------------------------
    # POST /api/dev/enrol hands out an enrolled device cookie. The app already
    # answers 404 there unless SANK_DEV_ENROL=1, and /opt/sank/.env does not set
    # it — that is the real guard, and it is a positive opt-in precisely so that
    # forgetting something never opens it.
    #
    # This block is the second lock on the same door: even if that variable were
    # ever set on this machine by accident, the path does not reach the app from
    # the internet. It costs nothing and it removes the worst possible outcome
    # of one typo in an .env file.
    location /api/dev/ {
        return 404;
    }
}
