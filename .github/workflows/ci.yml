# The gate on `main`. Both developers work in parallel on branches that both
# touch this one repo, so the only thing keeping `main` usable is that every
# push and every pull request runs the same four commands a developer runs
# locally: install, typecheck, unit tests, production build.
#
# Nothing here talks to a VPS or to a database file — vitest opens SQLite
# `:memory:` databases and runs the real migrations against them, so CI needs
# no services and no secrets.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A second push to the same branch cancels the run still going for the first
# one; the last commit is the only one whose result anybody reads.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 LTS — the same major the VPS runs under systemd.
          node-version: '22'
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins and fails if the
      # lockfile drifted from package.json — that is why it is `ci` and not
      # `install`. better-sqlite3 is a native module; it downloads a prebuilt
      # binary for linux-x64 here, so no compiler is needed.
      - name: Install
        run: npm ci

      # `nuxt prepare` (the postinstall) generated .nuxt/tsconfig.*; this checks
      # both sides of the app — server routes and Vue components — against
      # shared/types.ts. A fixture that no longer matches the contract fails
      # here, which is the point of typing the fixtures.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
